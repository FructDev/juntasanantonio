<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Junta de Vecinos Sector San Antonio">
  <title>Junta de Vecinos · Sector San Antonio · Unión y Esfuerzo</title>
  <defs>
    <path id="T" d="M 10,60 A 50,50 0 0,0 110,60"/>
    <path id="B" d="M 10,60 A 50,50 0 0,1 110,60"/>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4fbf4"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="59"   fill="#1a7a1a"/>
  <circle cx="60" cy="60" r="52"   fill="#38a838"/>
  <circle cx="60" cy="60" r="46.5" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
