  <path d="M 22,41 Q 23,54 33,58 Q 40,61 44,58" fill="none" stroke="#1565c0" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 29,38 Q 38,35 44,42" fill="none" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>

