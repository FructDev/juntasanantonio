  <path d="M 98,40 Q 100,32 105,29" fill="none" stroke="#f5a000" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Child (green) -->
  <circle cx="60" cy="67" r="4" fill="#43a047"/>
  <path d="M 56.5,71 Q 60,79 63.5,71 Z" fill="#43a047"/>

  <!-- Text -->
  <text x="60" y="82"   text-anchor="middle" font-family="Arial,sans-serif" font-size="4.6" font-weight="800" fill="#1a7a1a" letter-spacing="0.4">CONSTRUYENDO UN</text>
  <text x="60" y="88.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="4.6" font-weight="800" fill="#1a7a1a" letter-spacing="0.4">FUTURO MEJOR</text>
  <line x1="37" y1="92.5" x2="55" y2="92.5" stroke="#1a7a1a" stroke-width="0.7" opacity="0.35"/>
  <circle cx="60" cy="92.5" r="2.5" fill="#f9c21a" opacity="0.7"/>
  <line x1="65" y1="92.5" x2="83" y2="92.5" stroke="#1a7a1a" stroke-width="0.7" opacity="0.35"/>

  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#f9c21a" stroke-width="0.9" opacity="0.45"/>
