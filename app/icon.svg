  <text font-family="Arial Black,Arial,sans-serif" font-size="8.8" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2.2">
    <textPath href="#T" startOffset="50%">JUNTA DE VECINOS</textPath>
  </text>
  <text font-family="Arial Black,Arial,sans-serif" font-size="8.2" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1.9">
    <textPath href="#B" startOffset="50%">UNIÓN Y ESFUERZO</textPath>
  </text>

  <!-- Green swooshes -->
  <path d="M 36,68 Q 20,52 24,32 Q 28,18 42,18 Q 52,18 57,24 Q 50,27 44,37 Q 37,50 36,68 Z" fill="#38a838"/>
  <path d="M 84,68 Q 100,52 96,32 Q 92,18 78,18 Q 68,18 63,24 Q 70,27 76,37 Q 83,50 84,68 Z" fill="#38a838"/>

