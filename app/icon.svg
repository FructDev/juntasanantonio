  <circle cx="98" cy="34" r="7" fill="#f5a000"/>
  <path d="M 98,41 Q 97,54 87,58 Q 80,61 76,58" fill="none" stroke="#f5a000" stroke-width="5.5" stroke-linecap="round"/>
